plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  instance-state-name:
    - running

keyed_groups:
  - key: tags.Role
    prefix: tag_Role

hostnames:
  - instance-id

compose:
  ansible_host: instance_id
  ansible_connection: "'community.aws.aws_ssm'"
  ansible_user: "'ec2-user'"
  ansible_aws_ssm_bucket_name: "'ecommerce-devops-ansible-ssm-632638637512'"
  ansible_aws_ssm_region: "'us-east-1'"
